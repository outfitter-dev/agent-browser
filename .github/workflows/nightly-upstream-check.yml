name: Nightly Upstream Check

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if versions match'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: vercel-labs/agent-browser
  UPSTREAM_BRANCH: main

jobs:
  check-upstream:
    name: Check for Upstream Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Fetch upstream version
        id: upstream
        run: |
          # Fetch the package.json from upstream main branch
          UPSTREAM_PACKAGE=$(curl -sL "https://raw.githubusercontent.com/${{ env.UPSTREAM_REPO }}/${{ env.UPSTREAM_BRANCH }}/package.json")
          UPSTREAM_VERSION=$(echo "$UPSTREAM_PACKAGE" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
          echo "version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "Upstream version: $UPSTREAM_VERSION"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          FORCE="${{ inputs.force_update }}"

          echo "Comparing versions: current=$CURRENT, upstream=$UPSTREAM"

          # Use node for semver comparison
          NEEDS_UPDATE=$(node -e "
            const current = '$CURRENT'.split('.').map(Number);
            const upstream = '$UPSTREAM'.split('.').map(Number);

            let needsUpdate = false;
            for (let i = 0; i < 3; i++) {
              if (upstream[i] > current[i]) {
                needsUpdate = true;
                break;
              } else if (upstream[i] < current[i]) {
                break;
              }
            }
            console.log(needsUpdate ? 'true' : 'false');
          ")

          if [ "$FORCE" = "true" ]; then
            NEEDS_UPDATE="true"
            echo "Force update requested"
          fi

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          echo "Needs update: $NEEDS_UPDATE"

      - name: Setup git config
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" || true
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Create update branch
        if: steps.compare.outputs.needs_update == 'true'
        id: branch
        run: |
          UPSTREAM_VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH_NAME="upstream-update/v${UPSTREAM_VERSION}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Check if branch already exists remotely
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, skipping update"
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Merge upstream changes
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true'
        id: merge
        run: |
          # Attempt to merge upstream
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit -m "Merge upstream v${{ steps.upstream.outputs.version }}"; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "Merge successful"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "Merge conflicts detected"
            # Output conflicting files for the PR body
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            echo "conflicts<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/conflicts.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            # Abort the merge for now - we'll create a PR noting the conflicts
            git merge --abort
          fi

      - name: Sync version to Cargo.toml
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          # Run version sync if it exists
          if [ -f "scripts/sync-version.js" ]; then
            node scripts/sync-version.js
            git add cli/Cargo.toml
            git commit -m "chore: sync version to Cargo.toml" || echo "No changes to commit"
          fi

      - name: Push update branch
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          git push -u origin "${{ steps.branch.outputs.branch_name }}"

      - name: Create Pull Request
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true' && steps.merge.outputs.merge_success == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          base: main
          title: "chore: update to upstream v${{ steps.upstream.outputs.version }}"
          body: |
            ## Upstream Update

            This PR updates the repository to match upstream version **v${{ steps.upstream.outputs.version }}**.

            ### Changes
            - Merged changes from [vercel-labs/agent-browser](https://github.com/vercel-labs/agent-browser) `${{ env.UPSTREAM_BRANCH }}` branch
            - Updated version from `${{ steps.current.outputs.version }}` to `${{ steps.upstream.outputs.version }}`

            ### Upstream Comparison
            [View changes on upstream](https://github.com/${{ env.UPSTREAM_REPO }}/compare/v${{ steps.current.outputs.version }}...v${{ steps.upstream.outputs.version }})

            ### After Merging
            Once this PR is merged, a new release tag `v${{ steps.upstream.outputs.version }}` should be created.

            ---
            *This PR was automatically created by the nightly upstream check workflow.*
          labels: |
            upstream-update
            automated

      - name: Create conflict notification issue
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true' && steps.merge.outputs.merge_success == 'false'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Upstream update v${{ steps.upstream.outputs.version }} has merge conflicts"
          content-filepath: /dev/stdin
          labels: |
            upstream-update
            needs-attention
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        continue-on-error: true

      - name: Create conflict issue (fallback)
        if: steps.compare.outputs.needs_update == 'true' && steps.branch.outputs.branch_exists != 'true' && steps.merge.outputs.merge_success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = `${{ steps.merge.outputs.conflicts }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream update v${{ steps.upstream.outputs.version }} has merge conflicts`,
              body: `## Merge Conflicts Detected

            The nightly upstream check found a new version **v${{ steps.upstream.outputs.version }}** but could not automatically merge due to conflicts.

            ### Conflicting Files
            \`\`\`
            ${conflicts}
            \`\`\`

            ### Manual Resolution Required
            To resolve this manually:
            \`\`\`bash
            git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
            git fetch upstream ${{ env.UPSTREAM_BRANCH }}
            git checkout -b upstream-update/v${{ steps.upstream.outputs.version }}
            git merge upstream/${{ env.UPSTREAM_BRANCH }}
            # Resolve conflicts
            git push -u origin upstream-update/v${{ steps.upstream.outputs.version }}
            \`\`\`

            ---
            *This issue was automatically created by the nightly upstream check workflow.*`,
              labels: ['upstream-update', 'needs-attention']
            });

      - name: Summary
        run: |
          echo "## Nightly Upstream Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current Version | ${{ steps.current.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream Version | ${{ steps.upstream.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Needed | ${{ steps.compare.outputs.needs_update }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compare.outputs.needs_update }}" = "true" ]; then
            if [ "${{ steps.branch.outputs.branch_exists }}" = "true" ]; then
              echo "| Status | Branch already exists |" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.merge.outputs.merge_success }}" = "true" ]; then
              echo "| Status | PR created successfully |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Status | Merge conflicts - issue created |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Status | Already up to date |" >> $GITHUB_STEP_SUMMARY
          fi

  # Optional: Auto-tag after PR merge (runs on push to main)
  auto-tag:
    name: Auto-tag on Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version tag exists
        id: check_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          VERSION="${{ steps.check_tag.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Created and pushed tag v$VERSION"
